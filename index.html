<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Bump ?v=N whenever favicon.svg's content changes — browsers (Safari
         especially) cache favicons by exact URL, sometimes past a normal
         cache clear, so a visitor with the old icon cached will only ever
         see the new one if the URL itself changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rishab Sachidanand</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
